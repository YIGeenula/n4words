<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT N4 Kanji — Lesson Separator Pages (Lesson 1 - 12)</title>
  <meta name="description"
    content="Colorful lesson separator cover pages for JLPT N4 Kanji PDF (10 kanji per lesson, Lessons 1 to 12). Ready for A4 print and PDF export.">

  <!-- Google Fonts: Shippori Mincho, Zen Kaku Gothic, Cormorant Garamond, Outfit, Noto Sans Sinhala -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,700&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Screen Navigation & Controls (Hidden in Print) -->
  <header class="sep-header no-print">
    <div class="header-content">
      <div class="header-brand">
        <a href="../index.html" class="action-btn back-btn" id="btnBackHome" title="Return to N4 Study Notebook Main Website">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Main Website</span>
        </a>
        <div class="brand-info-wrap">
          <div class="hanko-mini">漢字</div>
          <div class="brand-titles">
            <h1>N4 Kanji Lesson Separators</h1>
            <p>12 Divider Cover Pages (10 Kanji per Lesson · #38bdf8)</p>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <div class="view-mode-group">
          <button class="action-btn active" id="btnSingleView" title="View one lesson at a time">Single Page</button>
          <button class="action-btn" id="btnAllView" title="View all 12 lessons consecutively for printing">All 12 Pages</button>
        </div>

        <div class="print-action-group">
          <button class="action-btn print-btn" id="btnPrintCurrent" title="Print only the selected lesson separator">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            Print Current Page
          </button>
          <button class="action-btn print-btn primary" id="btnPrintAll" title="Print all 12 separator pages as a multi-page PDF">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            Export All 12 (PDF)
          </button>
        </div>
      </div>
    </div>

    <!-- Quick Lesson Navigation Bar -->
    <nav class="lesson-tabs-bar" id="lessonTabsBar" aria-label="Lesson Selection">
      <!-- Generated dynamically by script.js -->
    </nav>
  </header>

  <!-- Printable Separator Pages Container -->
  <main id="separatorContainer" class="separator-container">
    <!-- Generated by script.js for each Lesson 1 to 12 -->
  </main>

  <script src="script.js"></script>
</body>

</html>
